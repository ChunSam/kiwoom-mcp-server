name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow only runs the local gates, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Min supported (engines: node >=20.12) + current LTS.
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # 버전 5곳 동기화 + CLAUDE.md 실측 카운트 + README tool 문서화. pre-commit은
      # 카운트를 경고로만 넘기므로, 머지 전에 막는 건 여기다.
      - run: npm run check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # 프로덕션 의존성만, high 이상만 막는다. 이 서버는 실계좌를 앞에 두므로 런타임에
      # 실제로 실리는 코드의 취약점은 알고 넘어가면 안 된다 — 실제로 SDK 전이 의존성
      # 3건(hono ReDoS · ip-address SSRF 우회 2건 · fast-uri host confusion)이 아무도
      # 모르는 채 쌓여 있었다. devDependencies는 tarball에 안 실려 제외한다.
      #
      # 새 advisory가 뜨면 관련 없는 PR도 빨개진다 — 그게 이 단계의 값이자 비용이다.
      # 대개 `npm audit fix`(lockfile만 변경)로 풀리고, 고칠 수 없는 건이면
      # `--audit-level=critical`로 임시 완화하되 이유를 커밋에 남긴다.
      - name: 프로덕션 의존성 취약점 (high 이상)
        run: npm audit --omit=dev --audit-level=high

  # 브랜치 보호가 요구하는 **유일한 체크**. 이름이 고정돼 있어야 하므로 matrix에서 떼어냈다.
  #
  # 예전에는 보호 규칙이 `typecheck · test · build (20)`·`(22)`를 직접 요구했는데, 그러면
  # job name이나 matrix를 건드리는 순간 보호가 조용히 깨진다 — 없어진 체크를 영원히
  # 기다리거나(머지 불가), 새로 생긴 체크가 요구 목록에 없어 그냥 통과한다(장치 무력화).
  # 이제 matrix에 Node를 넣고 빼도 보호 규칙은 그대로 둔다.
  #
  # `if: always()`가 핵심이다. 이게 없으면 matrix가 실패했을 때 이 job은 **skipped**가 되고,
  # GitHub은 skipped 필수 체크를 실패로 보지 않아 머지가 통과해 버린다.
  ci:
    name: ci
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Matrix 결과 확인
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check job result: $RESULT"
          test "$RESULT" = "success"
