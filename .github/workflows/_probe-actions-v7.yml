name: _probe-actions-v7

# 임시 프로브 — 머지 전에 지운다.
#
# release.yml은 태그를 밀어야만 도는데, 그때 실패하면 발행 중간에 멈춘다. 그래서 발행
# 직전까지의 구성(checkout v7 · setup-node v7 · node24 · registry-url · npm ci · 게이트)을
# 그대로 재현해 workflow_dispatch로 먼저 찍는다. publish는 하지 않는다.

# workflow_dispatch는 **기본 브랜치에 파일이 있어야** 부를 수 있다(404). 프로브는 main에
# 올리지 않는 게 요점이므로 이 브랜치 push로 건다.
on:
  push:
    branches: [chore/actions-v7]

permissions:
  contents: read
  id-token: write # release.yml과 같은 권한 — .npmrc·OIDC 환경까지 같은 조건으로 만든다

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm 버전 확인 (trusted publishing 요건 11.5.1+)
        run: |
          npm install -g npm@latest
          V=$(npm --version)
          MIN=$(printf '%s\n11.5.1\n' "$V" | sort -V | head -1)
          echo "npm $V"
          test "$MIN" = "11.5.1" || { echo "::error::npm >= 11.5.1이 필요합니다 (현재 $V)"; exit 1; }

      # setup-node v7이 더미 NODE_AUTH_TOKEN export를 없앴다. .npmrc가 여전히
      # `_authToken=${NODE_AUTH_TOKEN}`을 쓰는지, 그 값이 비었는지를 눈으로 확인한다.
      - name: .npmrc·NODE_AUTH_TOKEN 상태
        run: |
          echo "--- .npmrc ---"; cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || cat ~/.npmrc
          echo "--- NODE_AUTH_TOKEN 설정 여부: ${NODE_AUTH_TOKEN:+설정됨}${NODE_AUTH_TOKEN:-비어 있음} ---"

      - run: npm ci

      - name: 게이트
        run: |
          npm run check
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      # 실제 발행은 하지 않는다. dry-run도 레지스트리에 묻기 때문에 **현재 버전이 이미
      # 발행돼 있으면 "cannot publish over"로 exit 1**이 난다 — 그건 인증·레지스트리 경로가
      # 살아 있다는 증거이므로 그 메시지일 때만 통과시키고, 다른 실패는 그대로 빨갛게 둔다.
      - name: npm publish --dry-run (이미 발행된 버전 에러만 허용)
        run: |
          set +e
          OUT=$(npm publish --dry-run 2>&1); RC=$?
          echo "$OUT"
          set -e
          if [ $RC -eq 0 ]; then
            echo "dry-run 통과 (미발행 버전)"
          elif echo "$OUT" | grep -q "cannot publish over the previously published versions"; then
            echo "이미 발행된 버전이라 여기서 멈췄다 — 레지스트리까지 도달했다는 뜻이다."
          else
            echo "::error::dry-run이 예상 밖 이유로 실패했다"; exit 1
          fi
